[project]
name = "dataset-viewer"
version = "0.1.0"
description = "Browse JSONL / CSV / inspect-ai .eval datasets in the browser: chat & table views, regex/SQL filters, marks, LLM judges, optional embedded Claude chat."
readme = "README.md"
authors = [
    { name = "Clement Dumas", email = "clement.dumas@ens-paris-saclay.fr" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "sse-starlette>=2.1",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    # .eval log reading + the judge runner both go through inspect-ai.
    "inspect-ai>=0.3.125",
]

[project.optional-dependencies]
# Embedded Claude chat drawer + NL→SQL. The app degrades gracefully without it.
chat = ["claude-agent-sdk>=0.1"]

[project.scripts]
dataset-viewer = "dataset_viewer.serve:main"
viewer = "dataset_viewer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_viewer"]
# web_dist/ is produced by the build hook (hatch_build.py) at wheel build time.
artifacts = ["src/dataset_viewer/web_dist/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/dataset_viewer/**",
    "web/**",
    "hatch_build.py",
    "README.md",
]
exclude = [
    "web/node_modules/**",
    "web/dist/**",
    "web/tsconfig.tsbuildinfo",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "playwright>=1.48",
    "pytest-playwright>=0.5",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
timeout = 120
asyncio_mode = "auto"
testpaths = ["tests"]
