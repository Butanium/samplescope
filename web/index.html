<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>samplescope</title>
    <script>
      // Apply theme before paint so we never flash the wrong palette.
      (function () {
        var saved = localStorage.getItem("viewer.theme");
        var prefers = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = saved ? saved === "dark" : prefers;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
